<!DOCTYPE html>
<html>
<head>
  <title>Anagrafica 4.0</title>
</head>
<body>

  <input type="text" id="nome"> Nome <br>
  <input type="text" id="cognome"> Cognome <br>
  <input type="number" id="eta"> Età <br>
  <input type="text" id="citta"> Città <br>
  <input type="text" id="cap"> CAP <br>
  <input type="text" id="email"> E-mail <br>
  <input type="text" id="telefono"> Telefono <br>
  <input type="text" id="professione"> Professione <br>
  <input type="text" id="nazione"> Nazione <br>

  <input type="button" value="Inserisci" onclick="ana()">

  <table border="1">
    <tr>
      <th>Nome</th>
      <th>Cognome</th>
      <th>Età</th>
      <th>Città</th>
      <th>CAP</th>
      <th>Email</th>
      <th>Telefono</th>
      <th>Professione</th>
      <th>Nazione</th>
    </tr>
    <tbody id="cont"></tbody>
  </table>

<script>

let cont = document.getElementById("cont");
let elementi = JSON.parse(localStorage.getItem("elenco"))  ;

function mostraTabella() {
  cont.innerHTML = "";
  for (let i = 0; i < elementi.length; i++) {
    let tr = document.createElement("tr");

    tr.innerHTML =
      "<td>" + elementi[i].nome + "</td>" +
      "<td>" + elementi[i].cognome + "</td>" +
      "<td>" + elementi[i].eta + "</td>" +
      "<td>" + elementi[i].citta + "</td>" +
      "<td>" + elementi[i].cap + "</td>" +
      "<td>" + elementi[i].email + "</td>" +
      "<td>" + elementi[i].telefono + "</td>" +
      "<td>" + elementi[i].professione + "</td>" +
      "<td>" + elementi[i].nazione + "</td>";

    cont.appendChild(tr);
  }
}

function ana() {

  let nome = document.getElementById("nome");
  let cognome = document.getElementById("cognome");
  let eta = document.getElementById("eta");
  let citta = document.getElementById("citta");
  let cap = document.getElementById("cap");
  let email = document.getElementById("email");
  let telefono = document.getElementById("telefono");
  let professione = document.getElementById("professione");
  let nazione = document.getElementById("nazione");

  let soloLettere = /^[A-Za-z]+$/;
  let lettereSpazi = /^[A-Za-z\s]+$/;
  let cinqueNumeri = /^\d{5}$/;
  let emailRegex = /^\S+@\S+\.\S+$/;
  let soloNumeriTel = /^\d{8,15}$/;

  if (!soloLettere.test(nome.value)) {
    nome.style.border = "2px solid red";
    return;
  }

  if (!soloLettere.test(cognome.value)) {
    cognome.style.border = "2px solid red";
    return;
  }

  if (!lettereSpazi.test(citta.value)) {
    citta.style.border = "2px solid red";
    return;
  }

  if (!cinqueNumeri.test(cap.value)) {
    cap.style.border = "2px solid red";
    return;
  }

  if (!emailRegex.test(email.value)) {
    email.style.border = "2px solid red";
    return;
  }

  if (!soloNumeriTel.test(telefono.value)) {
    telefono.style.border = "2px solid red";
    return;
  }

  const persone = {
    nome: nome.value,
    cognome: cognome.value,
    eta: eta.value,
    citta: citta.value,
    cap: cap.value,
    email: email.value,
    telefono: telefono.value,
    professione: professione.value,
    nazione: nazione.value
  };

  elementi.push(persone);
  localStorage.setItem("elenco", JSON.stringify(elementi));

  mostraTabella();
}
</script>

</body>
</html>
